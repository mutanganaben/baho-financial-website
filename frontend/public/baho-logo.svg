<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <!-- Outer Circle Ring -->
  <circle cx="200" cy="140" r="100" fill="none" stroke="#1D4478" stroke-width="16"/>
  
  <!-- Intertwined Monogram BP / BAHO Symbol -->
  <g fill="none" stroke="#1D4478" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Vertical Stem -->
    <path d="M 165 75 L 165 205" />
    
    <!-- Top Loop (B) -->
    <path d="M 165 75 C 220 75, 220 135, 165 135" />
    
    <!-- Bottom Loop (B) -->
    <path d="M 165 135 C 225 135, 225 205, 165 205" />
    
    <!-- Inner Accent Line (F / D curve) -->
    <path d="M 165 145 L 195 145 C 210 145, 210 175, 195 175 L 165 175" stroke-width="12" />
  </g>
  
  <!-- Brand Text: BAHO -->
  <text x="200" y="300" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" fill="#1D4478" letter-spacing="4">BAHO</text>
  
  <!-- Subtitle: FINANCIAL LTD. -->
  <text x="200" y="345" text-anchor="middle" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="26" fill="#1D4478" letter-spacing="5">FINANCIAL LTD.</text>
</svg>
